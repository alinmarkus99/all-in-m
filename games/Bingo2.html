<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CERMIN DIRI : REALITA ZAMAN INI</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f9fbfc;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background: none;
      padding: 2.5rem 1rem 1.5rem;
      border-bottom: 2px solid #e0e0e0;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #345c72;
    }

    header p {
      margin-top: 0.5rem;
      color: #6a7d7d;
      font-style: italic;
    }

    main {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .bingo-cell {
      background: white;
      border: 2px solid #d9e6eb;
      border-radius: 12px;
      padding: 0.8rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }

    .bingo-cell:hover {
      transform: translateY(-2px);
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .bingo-cell.marked {
      background: linear-gradient(135deg, #b7e1e4, #c8f3d2, #f8c6c6);
      color: #2a2a2a;
      font-weight: 600;
      transform: scale(0.97);
    }

    .bingo-cell.free {
      background: #e7f4f3;
      font-weight: 600;
      color: #345c72;
      border-style: dashed;
    }

    button {
      margin-top: 2rem;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #b4e0eb, #d0f0d0);
      color: #2f4f4f;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #a6d7e2, #b9eabc);
      transform: scale(1.05);
    }

    footer {
      margin-top: 3rem;
      padding: 1rem;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bingo - Realita Ego Zaman ini</h1>
    <p>Tandai sifat yang tanpa sadar ataupun sadar pernah kamu lakukan</p>
  </header>

  <main>
    <div class="bingo-grid" id="bingoGrid"></div>
    <button onclick="resetBingo()">Mulai Ulang</button>
  </main>

  <footer>
    🤍 Dibuat oleh alin — Refleksi diri dengan hati 🤍
  </footer>

  <script>
    const items = [
      "Terlalu cinta diri sendiri",
      "Hidup cuma buat duit",
      "Tukang pamer & sok keren",
      "Suka ngomongin orang",
      "Ngelawan orangtua",
      "Nggak tahu terima kasih",
      "Nggak peduli Tuhan",
      "Gampang marah, susah damai",
      "Hobi nyebar gosip",
      "Nggak bisa ngerem hawa nafsu",
      "Galak sama yang baik",
      "Tukang tikung & penghianat",
      "Nekat tanpa mikir panjang",
      "Sok tahu tapi kosong",
      "Lebih nurut nafsu daripada Tuhan"
    ];

    const gridElement = document.getElementById("bingoGrid");

    let savedGrid = JSON.parse(localStorage.getItem("bingoGrid4x4")) || null;
    let savedMarks = JSON.parse(localStorage.getItem("bingoMarks4x4")) || {};

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function createGrid() {
      let gridItems = savedGrid || shuffle([...items]);
      localStorage.setItem("bingoGrid4x4", JSON.stringify(gridItems));

      gridElement.innerHTML = "";
      let index = 0;

      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
          const cell = document.createElement("div");
          cell.classList.add("bingo-cell");

          // Posisi (1,1) jadi FREE (karena 4x4 tidak ada tengah sempurna)
          if (row === 1 && col === 1) {
            cell.textContent = "FREE";
            cell.classList.add("free");
          } else {
            cell.textContent = gridItems[index++];
          }

          if (savedMarks[cell.textContent]) {
            cell.classList.add("marked");
          }

          cell.addEventListener("click", () => toggleMark(cell));
          gridElement.appendChild(cell);
        }
      }
    }

    function toggleMark(cell) {
      const text = cell.textContent;
      cell.classList.toggle("marked");
      savedMarks[text] = cell.classList.contains("marked");
      localStorage.setItem("bingoMarks4x4", JSON.stringify(savedMarks));
    }

    function resetBingo() {
      localStorage.removeItem("bingoGrid4x4");
      localStorage.removeItem("bingoMarks4x4");
      savedGrid = null;
      savedMarks = {};
      createGrid();
    }

    createGrid();
  </script>
</body>
</html>
