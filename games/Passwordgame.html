<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Password Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f9fbfc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    .box {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 1rem;
      text-align: center;
      letter-spacing: 3px;
    }

    button {
      margin-top: 1rem;
      padding: 0.7rem 1.5rem;
      border-radius: 20px;
      border: none;
      background: #9ecbd3;
      color: #234;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #88b8c2;
    }

    .error {
      color: #d9534f;
      margin-top: 1rem;
      display: none;
    }

    .result {
      display: none;
      font-size: 2rem;
      font-weight: 600;
      margin-top: 1.5rem;
      color: #3b6b6b;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>🔐 Masukkan Password</h1>
  <p>8 angka untuk melanjutkan</p>

  <input type="password" id="password" maxlength="8" placeholder="********">
  <button onclick="checkPassword()">Lanjut</button>

  <div class="error" id="error">Password salah.</div>
  <div class="result" id="result">N H A A P A R</div>
</div>

<script>
  const correctPassword = "85968904"; // ← GANTI PASSWORD
  const secretWord = "N H A A P A R";      // ← GANTI KATA

  function checkPassword() {
    const input = document.getElementById("password").value;
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    if (input === correctPassword) {
      error.style.display = "none";
      result.style.display = "block";
    } else {
      error.style.display = "block";
      result.style.display = "none";
    }
  }
</script>

</body>
</html>
