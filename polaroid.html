<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f6f1e9;
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
    }.album {
  max-width: 1000px;
  margin: 40px auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 40px;
}

.polaroid {
  background: white;
  padding: 12px 12px 30px 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transform: rotate(var(--rotate));
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
}

.polaroid:hover {
  transform: scale(1.05) rotate(0deg);
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
  z-index: 2;
}

.polaroid img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.caption {
  font-family: 'Patrick Hand', cursive;
  margin-top: 10px;
  font-size: 16px;
  text-align: center;
  color: #444;
}

/* Random rotation */
.polaroid:nth-child(odd) { --rotate: -3deg; }
.polaroid:nth-child(even) { --rotate: 3deg; }
.polaroid:nth-child(3n) { --rotate: -5deg; }
.polaroid:nth-child(4n) { --rotate: 5deg; }

h1 {
  text-align: center;
  font-family: 'Patrick Hand', cursive;
  font-size: 36px;
  margin-top: 30px;
  color: #333;
}

  </style>
</head>
<body>  <h1>📸 Memory Album</h1>  <div class="album"><div class="polaroid">
  <img src="https://source.unsplash.com/random/300x300?nature" alt="">
  <div class="caption">Hari pertama liburan 🌿</div>
</div>

<div class="polaroid">
  <img src="https://source.unsplash.com/random/300x301?friends" alt="">
  <div class="caption">Bareng teman-teman 💕</div>
</div>

<div class="polaroid">
  <img src="https://source.unsplash.com/random/300x302?beach" alt="">
  <div class="caption">Pantai sore hari 🌊</div>
</div>

<div class="polaroid">
  <img src="https://source.unsplash.com/random/300x303?city" alt="">
  <div class="caption">Jalan-jalan malam 🌃</div>
</div>

  </div></body>
</html>
