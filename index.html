<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❕ ALIN's SPACE </title>
  <!-- Tambahkan link font Great Vibes dari Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }

    header {
      background-color: #fff;
      text-align: center;
      padding: 4rem 1rem 2rem;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4.5rem;
      margin: 0;
      color: #333;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.15);
      letter-spacing: 1px;
    }

    header p {
      font-style: italic;
      color: #666;
      margin-top: 0.5rem;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem 1rem;
    }

    .intro {
      max-width: 600px;
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      background: linear-gradient(135deg, #ffffff, #f2f2f2);
    }

    .intro h2 {
      color: #444;
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .intro p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .btn {
      display: inline-block;
      background-color: #899481;
      color: white;
      padding: 0.8rem 1.6rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      margin: 0.5rem;
      text-transform: uppercase;
    }

    .btn:hover {
      background-color: #7b7f63;
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #777;
      background: #e2e2e2;
    }

    footer a {
      color: #ff6f61;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Alin's Space</h1>
    <p> Repository Ide </p>
  </header>

  <main>
    <div class="intro">
      <h2>Selamat datang di Alin's Space </h2>
      <p>
        Tempat di mana setiap pemikiran, renungan, dan games menyenangkan tersimpan.  
        Sebuah ruang seru-seruan
      </p>
      <a href="catatan.html" class="btn">Catatan kecil</a>
      <a href="games/Utamagem.html" class="btn">Games Alkitab</a>
      <a href="Utamapojok.html" class="btn">Pojok Belajar</a>
       <a href="polaroid.html" class="btn">Memori</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 all-in-M. Dibuat dengan 🫰🎶.</p>
  </footer>
</body>
</html>
